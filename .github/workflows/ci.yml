name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs_only
      - "*.md"
      - "docs/**"
      - ".superdesign/**"
      - ".claude/**"
  pull_request:
    paths-ignore: *docs_only
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_DEBUG: "true"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install ruff==0.14.14
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Django check
        run: python manage.py check
      - name: Migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Test suite
        run: python manage.py test --parallel 4
      - name: JS checker tests
        run: node --test static/js/tests/*.test.mjs
      - name: Entrypoint syntax check
        run: bash -n scripts/docker-entrypoint.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
