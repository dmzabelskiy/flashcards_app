# Adjective + preposition pairs.
# One item per pair; an item lists its own pair first and then the other pairs
# of the same adjective, so an answer must match one pair as a whole.
slug: adjective-prepositions
trainer: adjective_preposition
label: Adjective + preposition
description: Fixed adjective–preposition pairs and the case they take.
order: 10
round_size: 20
instruction: Identify the fixed preposition and required case.
fields:
  - key: preposition
    label: Preposition
    kind: typed
    normalise: preposition
    placeholder: e.g. mit
  - key: case
    label: Case
    kind: choice
    normalise: exact
    options:
      - value: A
        label: Akkusativ
      - value: D
        label: Dativ
items:
  - id: abhaengig-von
    prompt: abhängig
    alternatives:
      - preposition: [von]
        case: [D]
        example: Immer mehr Menschen sind finanziell vom Staat abhängig.
  - id: angenehm-fuer
    prompt: angenehm
    alternatives:
      - preposition: [für]
        case: [A]
        example: Die Massage war sehr angenehm für ihn.
  - id: angesehen-bei
    prompt: angesehen
    alternatives:
      - preposition: [bei]
        case: [D]
        example: Der Pfarrer war bei allen Kirchgängern hoch angesehen.
  - id: angewiesen-auf
    prompt: angewiesen
    alternatives:
      - preposition: [auf]
        case: [A]
        example: Kinder sind auf die Hilfe Erwachsener angewiesen.
  - id: aergerlich-auf
    prompt: ärgerlich
    alternatives:
      - preposition: [auf]
        case: [A]
        example: Wegen der schlechten Noten war der Schüler ärgerlich auf den Lehrer.
      - preposition: [über]
        case: [A]
        example: Andi war ärgerlich über seine schlechte Leistung.
  - id: aergerlich-ueber
    prompt: ärgerlich
    alternatives:
      - preposition: [über]
        case: [A]
        example: Andi war ärgerlich über seine schlechte Leistung.
      - preposition: [auf]
        case: [A]
        example: Wegen der schlechten Noten war der Schüler ärgerlich auf den Lehrer.
  - id: befreundet-mit
    prompt: befreundet
    alternatives:
      - preposition: [mit]
        case: [D]
        example: Der Politiker ist mit der ganzen Welt befreundet.
  - id: begeistert-von
    prompt: begeistert
    alternatives:
      - preposition: [von]
        case: [D]
        example: Die Touristen sind begeistert von der unberührten Natur.
  - id: behilflich-bei
    prompt: behilflich
    alternatives:
      - preposition: [bei]
        case: [D]
        example: Der Vater ist behilflich beim Wechseln des Fahrradreifens.
  - id: bekannt-fuer
    prompt: bekannt
    alternatives:
      - preposition: [für]
        case: [A]
        example: Die Schwaben sind bekannt für ihre Sparsamkeit.
      - preposition: [mit]
        case: [D]
        example: Der Bürgermeister ist mit vielen Prominenten bekannt.
  - id: bekannt-mit
    prompt: bekannt
