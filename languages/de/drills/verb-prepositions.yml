# Verbs with their governing preposition, with glosses per target language.
slug: verb-prepositions
trainer: verb_preposition
label: Verb + preposition
description: Verbs with their governing preposition and case.
order: 20
round_size: 20
instruction: Translate the verb into {target_label} and choose its German preposition.
hint: Both answers must be correct · the required case appears after submission
fields:
  - key: translation
    label: '{target_label}'
    kind: typed
    normalise: translation
    placeholder: Type the translation
  - key: preposition
    label: Präposition
    kind: pool_choice
    normalise: exact
