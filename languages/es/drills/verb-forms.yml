# Spanish verb forms: the form of a verb in a given tense and person.
slug: verb-forms
trainer: es_verb_form
label: Verb forms
description: Conjugate common Spanish verbs, regular and irregular, in the present, the preterite and the imperfect, plus irregular participles and gerunds.
order: 10
round_size: 20
targets: [ru]
pictogram: verb
instruction: Write the Spanish verb form for the tense and person shown.
hint: Accents count, so hablo and habló are different answers · vosotros is the Spain form
