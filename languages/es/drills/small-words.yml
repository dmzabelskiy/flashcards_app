# Spanish small words: por and para, prepositions, al and del, personal a, pronouns, muy and mucho, también and tampoco, algo and nada.
slug: small-words
trainer: es_small_word
label: Small words
description: Fill the gap in a short sentence with the small word that belongs there, such as por or para, a preposition after a verb, al or del, a pronoun, or algo and nada.
order: 30
round_size: 20
targets: [ru]
pictogram: link
instruction: Fill the gap with the missing small word. A brackets cue names the choice.
hint: Accents count · a gap can take two words, as in se lo · the reason is shown after your answer
fields:
  - key: answer
    label: Answer
    kind: typed
    normalise: spanish
    placeholder: Type the missing word
