app = "flashcards-app-deu"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DJANGO_DEBUG = "false"
  DJANGO_DB_PATH = "/data/db.sqlite3"
  WEB_CONCURRENCY = "1"

[[mounts]]
  source = "flashcards_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
